name: tests

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Pint, PHPStan and audit
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*']
        include:
          - php: '8.3'
            laravel: '13.*'
          - php: '8.4'
            laravel: '13.*'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/phpunit

  guzzle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        guzzle: ['7.8.2', '8.*']
    name: Guzzle ${{ matrix.guzzle }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --no-update
      # Old Guzzle releases carry advisories; this job only checks that the package works across the supported range.
      - run: composer config policy.advisories.block false
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: composer show guzzlehttp/guzzle | grep "^versions"
      - run: vendor/bin/phpunit
