name: tests

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Pint, PHPStan and audit
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        include:
          - php: '8.3'
            laravel: '13.*'
          - php: '8.4'
            laravel: '13.*'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
      # Laravel 11 is past its security-fix window, so Composer refuses it by default. The advisories
      # are in the host framework under test, not in this package, and the quality job still audits.
      - if: matrix.laravel == '11.*'
        run: composer config policy.advisories.block false
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/phpunit
